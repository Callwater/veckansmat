<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#059669">
    <title>Veckomeny 2.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            padding-top: var(--safe-top);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .menu-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            border-left-width: 6px;
        }

        .menu-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }

        /* --- Vacker Utskriftsdesign --- */
        @media print {
            @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Quicksand:wght@500;700&display=swap');
            
            @page {
                margin: 0;
                size: A4 portrait;
            }
            
            /* Göm webb-UI */
            .no-print, nav, header, #action-bar, button, .fas.fa-tag, input[type="checkbox"], #temp-selector, #category-modal { 
                display: none !important; 
            }
            
            body { 
                background: #fdfbf7 !important; 
                color: #2b2b2b !important; 
                overflow: visible !important;
                height: auto !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-family: 'Quicksand', sans-serif !important;
                padding: 0 !important;
            }
            
            main { 
                padding: 0 !important; 
                max-width: 100% !important;
                overflow: visible !important;
            }

            #view-menu {
                display: block !important;
                padding: 1.5cm 2cm;
                min-height: 100vh;
                box-sizing: border-box;
                position: relative;
            }

            /* Dynamisk rubrik som hämtar veckonummer via kod */
            #view-menu::before {
                content: attr(data-title);
                display: block;
                text-align: center;
                font-family: 'Caveat', cursive;
                font-size: 55px;
                font-weight: 700;
                color: #2d4a36 !important;
                margin-bottom: 30px;
                letter-spacing: 1px;
            }

            #menu-result { 
                display: flex !important; 
                flex-direction: column !important;
                gap: 15px !important; 
                margin-bottom: 0 !important;
            }
            
            .menu-card { 
                break-inside: avoid;
                border: none !important;
                border-radius: 20px !important; 
                padding: 15px 25px !important;
                display: flex !important;
                flex-direction: row !important; 
                align-items: center !important;
                justify-content: space-between !important;
                min-height: 95px;
                position: relative;
                box-shadow: none !important;
            }

            /* Pedagogisk Färgkodning */
            .menu-card:nth-child(1) { background-color: #4ade80 !important; } /* Mån - Grön */
            .menu-card:nth-child(2) { background-color: #38bdf8 !important; } /* Tis - Blå */
            .menu-card:nth-child(3) { background-color: #ffffff !important; border: 2px solid #cbd5e1 !important; } /* Ons - Vit */
            .menu-card:nth-child(4) { background-color: #b47e5b !important; } /* Tor - Brun */
            .menu-card:nth-child(5) { background-color: #fde047 !important; } /* Fre - Gul */
            .menu-card:nth-child(6) { background-color: #f9a8d4 !important; } /* Lör - Rosa */
            .menu-card:nth-child(7) { background-color: #ef4444 !important; } /* Sön - Röd */

            /* Dag-namnet (Betydligt större nu) */
            .menu-card span.text-\\[10px\\] {
                font-family: 'Caveat', cursive;
                font-size: 36px !important; /* Ändrad från 26 till 36 */
                line-height: 0.9 !important;
                color: #000000 !important; 
                font-weight: 700 !important;
                text-transform: none !important;
                letter-spacing: normal !important;
                margin-bottom: 4px !important;
                display: inline-block;
            }

            /* Hjärtat till vänster */
            .menu-card::before {
                content: "♡";
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 16px;
                color: #000000 !important;
            }

            /* Tvingar texten att stanna inom ramarna och radbryta */
            .print-text-content {
                padding-left: 20px !important;
                flex: 1 1 0% !important; /* Tar upp all tillgänglig plats */
                min-width: 0 !important; /* Tvingar flexbox att krympa om texten är för lång */
                padding-right: 15px !important;
            }
            
            .menu-card h3 { 
                font-size: 19px !important; 
                margin: 0 !important;
                color: #111111 !important;
                font-weight: 700 !important;
                white-space: normal !important; /* Tillåter radbrytning */
                line-height: 1.2 !important;
            }
            
            .menu-card p {
                font-size: 13px !important;
                color: #222222 !important;
                margin-top: 4px !important;
                font-weight: 500 !important;
                white-space: normal !important; /* Radbryt ingredienser */
                display: -webkit-box !important;
                -webkit-line-clamp: 2 !important; /* Max 2 rader, sen lägger den till ... */
                -webkit-box-orient: vertical !important;
                overflow: hidden !important;
                line-height: 1.3 !important;
            }

            /* Skolkrock */
            .menu-card .absolute.-top-3 {
                top: 5px !important;
                right: 15px !important;
                left: auto !important;
                transform: none !important;
                font-family: sans-serif;
            }

            /* Låser bilden exakt så att alla hamnar rakt under varandra */
            .food-image {
                flex: 0 0 75px !important; /* Tillåter varken krympning eller förstoring */
                width: 75px !important;
                height: 75px !important;
                border-radius: 50% !important;
                object-fit: cover !important;
                border: 3px solid white !important;
                box-shadow: 0 4px 6px rgba(0,0,0,0.15) !important;
                margin-left: auto !important; /* Knuffar bilden maximalt åt höger */
                background-color: white !important;
            }

            /* --- INKÖPSLISTAN --- */
            #shopping-list-card { 
                display: block !important;
                break-before: page; 
                background: white !important;
                border: none !important;
                padding: 1.5cm 2cm !important;
                min-height: 100vh;
                box-sizing: border-box;
                border-radius: 0 !important;
            }
            
            #shopping-list-card h3 {
                color: #2d4a36 !important;
                font-family: 'Caveat', cursive;
                font-size: 45px !important;
                text-align: center;
                border: none !important;
                margin-bottom: 30px !important;
                letter-spacing: normal !important;
                text-transform: none !important;
            }

            #shopping-list-card h3 .fas { display: none !important; }
            
            #shopping-list-content {
                display: grid !important;
                grid-template-columns: 1fr 1fr 1fr !important;
                gap: 20px 30px !important;
            }
            
            #shopping-list-content > div {
                margin-top: 0 !important;
                padding-top: 0 !important;
                border: none !important;
                break-inside: avoid;
            }
            
            #shopping-list-content h4 {
                font-family: 'Caveat', cursive;
                font-size: 22px !important;
                color: #2d4a36 !important;
                border-bottom: 2px solid #eaf1e3;
                padding-bottom: 4px;
                margin-bottom: 8px;
                text-transform: none !important;
            }
            
            #shopping-list-content li {
                padding: 5px 0 !important;
                border: none !important;
            }
            
            #shopping-list-content span.text-sm {
                font-size: 14px !important;
                color: #2b2b2b !important;
                font-weight: 500 !important;
            }

            #shopping-list-content li::before {
                content: "☐";
                color: #2d4a36;
                font-size: 18px;
                margin-right: 8px;
                line-height: 1;
                font-family: sans-serif;
            }
            
            #total-price-tag { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen flex flex-col overflow-hidden">

    <header class="bg-emerald-600 text-white p-4 shadow-lg flex-none z-30 flex justify-between items-center no-print">
        <div class="flex items-center gap-2">
            <div class="bg-white/20 p-2 rounded-lg">
                <i class="fas fa-utensils text-white"></i>
            </div>
            <h1 class="text-lg font-bold tracking-tight">Veckomeny <span id="room-label" class="text-emerald-200 font-light"></span></h1>
        </div>
        <div id="connection-status" class="text-[10px] font-bold uppercase tracking-widest bg-black/10 px-3 py-1.5 rounded-full border border-white/20">
            <i class="fas fa-circle-notch fa-spin"></i> Ansluter...
        </div>
    </header>

    <nav id="tab-nav" class="bg-white border-b flex-none z-20 no-print">
        <div class="flex max-w-md mx-auto">
            <button onclick="window.app.showTab('menu')" id="tab-menu" class="flex-1 py-4 text-center text-xs font-bold uppercase tracking-wider text-emerald-600 border-b-2 border-emerald-600 transition-all">
                <i class="fas fa-home block text-lg mb-1"></i> Meny
            </button>
            <button onclick="window.app.showTab('add')" id="tab-add" class="flex-1 py-4 text-center text-xs font-bold uppercase tracking-wider text-slate-400 border-b-2 border-transparent transition-all">
                <i class="fas fa-plus block text-lg mb-1"></i> Skapa
            </button>
            <button onclick="window.app.showTab('list')" id="tab-list" class="flex-1 py-4 text-center text-xs font-bold uppercase tracking-wider text-slate-400 border-b-2 border-transparent transition-all">
                <i class="fas fa-book block text-lg mb-1"></i> Recept
            </button>
            <button onclick="window.app.showTab('settings')" id="tab-settings" class="flex-1 py-4 text-center text-xs font-bold uppercase tracking-wider text-slate-400 border-b-2 border-transparent transition-all">
                <i class="fas fa-sliders block text-lg mb-1"></i> Mer
            </button>
        </div>
    </nav>

    <main class="flex-grow overflow-y-auto w-full max-w-2xl mx-auto p-4 pb-12">
        
        <section id="view-menu" class="space-y-6">
            <div id="action-bar" class="glass-card p-5 rounded-2xl shadow-sm border border-slate-200 text-center no-print">
                <h2 class="text-sm font-semibold text-slate-500 mb-3 italic">Planera din vecka</h2>
                <div class="grid grid-cols-3 gap-3"> 
                    <button onclick="window.app.generateMenu()" class="bg-emerald-600 text-white font-bold py-3 px-2 rounded-xl shadow-md hover:bg-emerald-700 active:scale-95 transition-all text-xs">
                        <i class="fas fa-dice mr-1"></i> Slumpa
                    </button>
                    <button id="clash-btn" onclick="window.app.checkSchoolClashes()" class="bg-white text-emerald-700 border border-emerald-200 font-bold py-3 px-2 rounded-xl shadow-sm hover:bg-emerald-50 active:scale-95 transition-all text-xs">
                        <i class="fas fa-school mr-1 text-xs"></i> Skolkollen
                    </button>
                    <button onclick="window.print()" class="bg-slate-800 text-white font-bold py-3 px-2 rounded-xl shadow-md hover:bg-slate-900 active:scale-95 transition-all text-xs">
                        <i class="fas fa-print mr-1"></i> Skriv ut
                    </button>
                </div>
            </div>

            <div id="menu-result" class="space-y-4"></div>

            <div id="shopping-list-card" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-5 shadow-sm">
                <div class="flex justify-between items-center mb-4 border-b border-amber-200 pb-2">
                    <div class="flex items-center gap-2">
                        <h3 class="font-bold text-amber-900"><i class="fas fa-shopping-basket mr-2"></i>Inköpslista</h3>
                        <span id="total-price-tag" class="bg-amber-200/80 text-amber-900 text-xs font-bold px-2.5 py-0.5 rounded-full border border-amber-300"></span>
                    </div>
                    <button onclick="window.app.copyList()" class="bg-amber-200 text-amber-800 px-3 py-1 rounded-lg text-xs font-bold no-print hover:bg-amber-300 transition-all">Kopiera</button>
                </div>
                <div id="shopping-list-content" class="space-y-4"></div>
            </div>
        </section>

        <section id="view-add" class="hidden animate-in slide-in-from-right duration-300">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="form-title" class="text-xl font-bold text-slate-800">Skapa Recept</h2>
                    <button onclick="window.app.resetForm()" class="text-slate-400 hover:text-red-500"><i class="fas fa-rotate-left"></i></button>
                </div>
                <div class="space-y-4">
                    <input type="text" id="new-name" class="w-full p-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all" placeholder="Rättens namn...">
                    <input type="url" id="new-image" class="w-full p-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all" placeholder="Länk till bild (frivilligt)...">
                    <select id="new-category" class="w-full p-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none appearance-none transition-all">
                        <option value="kött">🥩 Kött</option>
                        <option value="kyckling">🍗 Kyckling</option>
                        <option value="fisk">🐟 Fisk</option>
                        <option value="pasta">🍝 Pasta</option> 
                        <option value="vegetarisk">🥦 Vegetariskt</option>
                        <option value="chark">🌭 Korv/Chark</option>
                        <option value="helg">🥂 Lyx/Helg</option>
                        <option value="övrigt">🍴 Övrigt</option>
                    </select>
                    <textarea id="new-ingredients" class="w-full p-4 bg-slate-50 border-none rounded-xl h-32 focus:ring-2 focus:ring-emerald-500 outline-none transition-all" placeholder="Ingredienser (separera med kommatecken)..."></textarea>
                    <button id="save-btn" onclick="window.app.saveDish()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-emerald-700 transition-all">Spara Recept</button>
                </div>
            </div>
        </section>

        <section id="view-list" class="hidden space-y-4">
            <div class="sticky top-0 z-10 bg-slate-50/80 backdrop-blur pb-2">
                <input type="text" id="search-input" onkeyup="window.app.filterDishes()" placeholder="Sök recept..." class="w-full p-4 bg-white border border-slate-200 rounded-2xl shadow-sm outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div id="all-dishes-list" class="grid gap-3"></div>
        </section>

        <section id="view-settings" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-bold text-slate-800">Rum & Backup</h3>
                <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100 flex items-center justify-between">
                    <span class="text-xs font-semibold text-emerald-800 uppercase tracking-tighter">Aktivt Rum</span>
                    <span id="room-id-val" class="text-sm font-bold text-emerald-600">Standard</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="window.app.exportJSON()" class="p-3 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all">Exportera</button>
                    <button onclick="document.getElementById('import-file').click()" class="p-3 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all">Importera</button>
                </div>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="window.app.importJSON(this)">
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-bold text-slate-800">Mina Butikskategorier</h3>
                <div class="flex gap-2">
                    <input type="text" id="new-custom-cat" class="flex-grow p-3 bg-slate-50 border-none rounded-xl text-sm outline-none" placeholder="T.ex. Husdjur">
                    <button onclick="window.app.addCategory()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Lägg till</button>
                </div>
                <div id="custom-categories-list" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="font-bold text-slate-800">Egna Varupriser</h3>
                <p class="text-xs text-slate-400">Varor där du angivit ett eget pris (ersätter schablonpriset):</p>
                <div id="custom-prices-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- Redigera Kategori & Pris Modal -->
        <div id="category-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
            <div class="bg-white rounded-3xl w-full max-w-xs p-6 shadow-2xl animate-in zoom-in duration-200">
                <h3 class="text-lg font-bold text-slate-800 mb-1">Ändra vara</h3>
                <p class="text-xs text-slate-400 mb-4">Inställningar för <span id="cat-edit-item-name" class="font-bold text-emerald-600"></span>.</p>
                
                <label class="block text-[10px] font-black uppercase text-slate-400 tracking-wider mb-1">Kategori</label>
                <select id="cat-edit-select" class="w-full p-3 bg-slate-50 border-none rounded-2xl mb-4 outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-500 text-sm transition-all"></select>

                <label class="block text-[10px] font-black uppercase text-slate-400 tracking-wider mb-1">Eget pris (SEK)</label>
                <input type="number" id="cat-edit-price" class="w-full p-3 bg-slate-50 border-none rounded-2xl mb-6 outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-500 text-sm transition-all" placeholder="T.ex. 45">

                <div class="flex gap-3">
                    <button onclick="document.getElementById('category-modal').classList.add('hidden')" class="flex-1 py-3 text-sm font-bold text-slate-400">Avbryt</button>
                    <button onclick="window.app.saveCategoryChange()" class="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-bold">Spara</button>
                </div>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-900 text-white rounded-full text-sm font-medium shadow-2xl opacity-0 translate-y-4 transition-all duration-300 pointer-events-none z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // --- RÄKNA UT VECKONUMMER ---
        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
        }

        // LÄGG IN VECKONUMMER I UTSKRIFTSRUBRIKEN
        const nuvarandeVecka = getWeekNumber(new Date());
        document.getElementById('view-menu').setAttribute('data-title', `Veckans matlista v.${nuvarandeVecka}`);

        const firebaseConfig = {
            apiKey: "AIzaSyA4tVwDuLbDIRTt6O9gnghpJRBOXjD6fI0",
            authDomain: "veckansmat-3ed6b.firebaseapp.com",
            projectId: "veckansmat-3ed6b",
            storageBucket: "veckansmat-3ed6b.firebasestorage.app",
            messagingSenderId: "199515297394",
            appId: "1:199515297394:web:d071866da9add8338954eb"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const db = getFirestore(firebaseApp);

        const state = {
            dishes: [],
            currentMenu: {},
            lockedDays: new Set(),
            clashes: {},
            room: new URLSearchParams(window.location.search).get('rum') || 'standard',
            editingId: null,
            itemToEdit: null,
            customCategories: {},
            customPrices: {},
            availableCategories: [],
            basvaror: new Set(['salt', 'peppar', 'smör', 'olja', 'mjöl', 'socker', 'buljong', 'soja', 'ketchup', 'senap'])
        };

        const PATHS = {
            dishes: `rum/${state.room}/recept`,
            menu: `rum/${state.room}/inställningar/aktuell_meny`
        };

        window.app = {
            showTab(tab) {
                ['menu', 'add', 'list', 'settings'].forEach(t => {
                    document.getElementById(`view-${t}`).classList.add('hidden');
                    document.getElementById(`tab-${t}`).classList.remove('text-emerald-600', 'border-emerald-600', 'bg-emerald-50');
                    document.getElementById(`tab-${t}`).classList.add('text-slate-400');
                });
                document.getElementById(`view-${tab}`).classList.remove('hidden');
                document.getElementById(`tab-${tab}`).classList.add('text-emerald-600', 'border-emerald-600', 'bg-emerald-50');
            },

            toggleLock(day) {
                if (state.lockedDays.has(day)) {
                    state.lockedDays.delete(day);
                } else {
                    state.lockedDays.add(day);
                }
                this.renderMenu();
            },

            openDishSelector(day) {
                const dishList = state.dishes.sort((a, b) => a.namn.localeCompare(b.namn));
                const html = dishList.map(d => `
                    <button onclick="window.app.selectDish('${day}', '${d.id}')" 
                            class="w-full text-left p-4 border-b border-slate-100 hover:bg-emerald-50 transition-colors flex justify-between items-center group">
                        <span class="font-bold text-sm text-slate-700 group-hover:text-emerald-700">${d.namn}</span>
                        <span class="text-[10px] uppercase font-black text-slate-400 bg-slate-100 px-2 py-1 rounded-md">${d.kategori || 'övrigt'}</span>
                    </button>
                `).join('');
                
                const modal = document.createElement('div');
                modal.id = 'temp-selector';
                modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 animate-in fade-in duration-200';
                modal.innerHTML = `
                    <div class="bg-white rounded-3xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200">
                        <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                            <h3 class="font-bold text-slate-800"><i class="fas fa-exchange-alt mr-2 text-emerald-500"></i> Byt ut ${day}</h3>
                            <button onclick="this.closest('#temp-selector').remove()" class="text-slate-400 hover:text-red-500 p-2"><i class="fas fa-times text-lg"></i></button>

            async generateMenu() {
                const days = ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lördag', 'Söndag'];
                const helgDays = ['Fredag', 'Lördag'];
                const vardagar = ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Söndag'];
                
                if(state.dishes.length < 10) return this.notify("Lägg till fler recept för bättre variation!");

                const newMenu = {};
                let usedIds = new Set();
                let usedKeywords = new Set();

                const getCoreWords = (name) => {
                    return name.toLowerCase()
                        .replace(/[^a-zåäö ]/g, " ")
                        .split(" ")
                        .filter(w => w.length >= 4 && !['stekt', 'kokt', 'ugns', 'filé', 'med', 'och', 'krämig', 'mild'].includes(w));
                };

                days.forEach(day => {
                    if (state.lockedDays.has(day) && state.currentMenu[day]) {
                        const dish = state.currentMenu[day];
                        newMenu[day] = dish;
                        usedIds.add(dish.id);
                        getCoreWords(dish.namn).forEach(w => usedKeywords.add(w));
                    } else {
                        newMenu[day] = null;
                    }
                });

                const getSmartPool = (cat = null) => {
                    return state.dishes.filter(d => {
                        if (usedIds.has(d.id)) return false;
                        if (cat && d.kategori !== cat) return false;
                        
                        const currentDishWords = getCoreWords(d.namn);
                        const isTooSimilar = currentDishWords.some(word => {
                            return Array.from(usedKeywords).some(used => {
                                return word.includes(used) || used.includes(word) || (word.substring(0,4) === used.substring(0,4));
                            });
                        });

                        return !isTooSimilar;
                    }).sort(() => 0.5 - Math.random());
                };

                const hasLockedFish = Array.from(usedIds).some(id => 
                    state.dishes.find(d => d.id === id)?.kategori === 'fisk'
                );
                if (!hasLockedFish) {
                    let pool = getSmartPool('fisk');
                    if (pool.length === 0) pool = state.dishes.filter(d => d.kategori === 'fisk' && !usedIds.has(d.id));
                    const day = vardagar.filter(d => !newMenu[d])[0];
                    if (pool[0] && day) {
                        newMenu[day] = pool[0];
                        usedIds.add(pool[0].id);
                        getCoreWords(pool[0].namn).forEach(w => usedKeywords.add(w));
                    }
                }

                helgDays.forEach(day => {
                    if (!newMenu[day]) {
                        let pool = getSmartPool('helg');
                        if (pool.length === 0) pool = getSmartPool();
                        const pick = pool[0] || state.dishes.filter(d => !usedIds.has(d.id))[0];
                        if (pick) {
                            newMenu[day] = pick;
                            usedIds.add(pick.id);
                            getCoreWords(pick.namn).forEach(w => usedKeywords.add(w));
                        }
                    }
                });

                days.forEach((day, i) => {
                    if (newMenu[day]) return;
                    let pool = getSmartPool();
                    if (pool.length === 0) pool = state.dishes.filter(d => !usedIds.has(d.id)).sort(() => 0.5 - Math.random());

                    const prevCat = newMenu[days[i-1]]?.kategori;
                    if (pool.length > 1 && pool[0].kategori === prevCat) {
                        const item = pool.shift();
                        pool.push(item);
                    }

                    const pick = pool[0];
                    if (pick) {
                        newMenu[day] = pick;
                        usedIds.add(pick.id);
                        getCoreWords(pick.namn).forEach(w => usedKeywords.add(w));
                    }
                });

                state.currentMenu = newMenu;
                await setDoc(doc(db, PATHS.menu), newMenu);
                this.renderMenu();
                this.notify("Varierad meny skapad!");
            },

            async checkSchoolClashes() {
                const btn = document.getElementById('clash-btn');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Synkar...';
                
                try {
                    const today = new Date();
                    const dayOfWeek = today.getDay(); 
                    const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
                    const monday = new Date(today);
                    monday.setDate(today.getDate() + diffToMonday);

                    const weekDates = {};
                    ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag'].forEach((name, i) => {
                        const d = new Date(monday);
                        d.setDate(monday.getDate() + i);
                        weekDates[name] = d.toISOString().split('T')[0];
                    });

                    // 👇 BYT UT DENNA LÄNK MOT DIN EGNA CLOUDFLARE WORKER 👇
                    const proxyUrl = `https://skolmat-proxy.br250power.workers.dev/?from=${weekDates['Måndag']}&to=${weekDates['Fredag']}`;

                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error("Proxyn svarade med felkod");
                    
                    const data = await res.json();
                    const schoolDays = Array.isArray(data) ? data : (data.data || []);
                    state.clashes = {};

                    const categories = {
                        pasta: ['pasta', 'makaroner', 'spaghetti', 'fusilli', 'penne', 'lasagne', 'tagliatelle', 'gnocchi', 'carbonara', 'bolognese', 'tortellini', 'ravioli'], 
                        fisk: ['sej', 'torsk', 'lax', 'spätta', 'fisk', 'strömming', 'kolja', 'hoki', 'fiskpinnar'],
                        färs: ['färs', 'köttfärs', 'köttbullar', 'biffar', 'pannbiff', 'järpar', 'kebab', 'hamburgare'],
                        korv: ['korv', 'falukorv', 'prinskorv', 'chorizo', 'bratwurst', 'istroband', 'isterband'], 
                        kyckling: ['kyckling', 'chicken', 'nuggets', 'filé'],
                        pannkaka: ['pannkaka', 'pannkakor', 'plättar', 'ugnspannkaka', 'raggmunkar', 'crepes'],
                        soppa: ['soppa', 'gulasch', 'minestrone', 'buljong']                                     
                    };

                    const ignoredWords = [
                        'potatis', 'potatismos', 'ris', 'bulgur', 'couscous', 'stuvad', 'stuvade', 
                        'kokt', 'kokta', 'stekt', 'stekta', 'ugnsbakad', 'med', 'till', 'sås'
                    ];

                    ['Måndag', 'Tisdag', 'Onsdag', 'Torsdag', 'Fredag'].forEach(dayName => {
                        const targetDate = weekDates[dayName];
                        const schoolDay = schoolDays.find(d => d.date && d.date.includes(targetDate));
                        if (!schoolDay || !schoolDay.meals) return;

                        const homeDish = state.currentMenu[dayName];
                        if (!homeDish) return;

                        const hName = homeDish.namn.toLowerCase();
                        const sMeal = schoolDay.meals.find(m => m.type === "Lunch 1");
                        if (!sMeal) return;
                        const sName = sMeal.name.toLowerCase();

                        let isClash = false;

                        for (const [cat, words] of Object.entries(categories)) {
                            const homeHasCat = words.some(w => hName.includes(w));
                            const schoolHasCat = words.some(w => sName.includes(w));
                            
                            if (homeHasCat && schoolHasCat) {
                                isClash = true;
                                break;
                            }
                        }

                        if (!isClash) {
                            const hKeywords = hName.replace(/[^a-zåäö ]/g, " ").split(" ")
                                .filter(w => w.length > 3 && !ignoredWords.includes(w));
                            
                            if (hKeywords.some(word => sName.includes(word))) {
                                isClash = true;
                            }
                        }

                        if (isClash) {
                            state.clashes[dayName] = sMeal.name;
                        }
                    });

                    this.renderMenu();
                    const count = Object.keys(state.clashes).length;
                    this.notify(count > 0 ? `${count} krockar hittade!` : "Inga krockar hittades.");
                    
                } catch(e) { 
                    console.error("Skolkollen error:", e);
                    this.notify("Kunde inte hämta skolmaten."); 
                } finally { 
                    btn.innerHTML = '<i class="fas fa-school mr-1 text-xs"></i> Skolkollen'; 
                }
            },

            handleDragEnd(e) {

                e.currentTarget.classList.add('border-emerald-400', 'bg-emerald-50/50');

            async handleDrop(e, targetDay) {
                e.preventDefault();
                e.currentTarget.classList.remove('border-emerald-400', 'bg-emerald-50/50');
                const sourceDay = e.dataTransfer.getData('text/plain');
                
                if (sourceDay && sourceDay !== targetDay) {
                    const tempDish = state.currentMenu[sourceDay];
                    state.currentMenu[sourceDay] = state.currentMenu[targetDay];
                    state.currentMenu[targetDay] = tempDish;
                    
                    const sourceWasLocked = state.lockedDays.has(sourceDay);
                    const targetWasLocked = state.lockedDays.has(targetDay);
                    
                    if(targetWasLocked) state.lockedDays.add(sourceDay); else state.lockedDays.delete(sourceDay);
                    if(sourceWasLocked) state.lockedDays.add(targetDay); else state.lockedDays.delete(targetDay);
                    
                    await setDoc(doc(db, PATHS.menu), state.currentMenu);
                    this.notify(`Bytte plats på ${sourceDay} och ${targetDay}!`);
                }
                this.renderMenu();
            },

                    'pasta': { label: '🍝 Pasta', color: 'bg-yellow-50 text-yellow-700' },
                    'vegetarisk': { label: '🥦 Vegetariskt', color: 'bg-emerald-50 text-emerald-700' },
                    'chark': { label: '🌭 Korv/Chark', color: 'bg-pink-50 text-pink-700' },
                    'helg': { label: '🥂 Lyx/Helg', color: 'bg-purple-50 text-purple-700' },
                    'övrigt': { label: '🍴 Övrigt', color: 'bg-slate-50 text-slate-700' }
                };

                const grouped = {};
                state.dishes.forEach(d => {
                    const cat = d.kategori || 'övrigt';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(d);
                });

                const sortedCats = Object.keys(grouped).sort((a, b) => {
                    const order = Object.keys(catInfo);
                    return order.indexOf(a) - order.indexOf(b);
                });

                sortedCats.forEach(cat => {
                    const info = catInfo[cat] || { label: cat.toUpperCase(), color: 'bg-slate-50 text-slate-700' };
                    const dishes = grouped[cat].sort((a, b) => a.namn.localeCompare(b.namn));

                    container.innerHTML += `
                        <div class="category-section mt-6 mb-2">
                            <h3 class="flex items-center gap-2 px-2 py-1 mb-3 text-sm font-black uppercase tracking-widest ${info.color} rounded-lg w-fit">
                                ${info.label} <span class="opacity-50 text-[10px] font-medium">(${dishes.length})</span>
                            </h3>
                            <div class="grid gap-3">
                                ${dishes.map(d => `
                                    <div class="dish-item bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center transition-all hover:border-emerald-200">
                                        <div class="flex items-center gap-3 overflow-hidden">
                                            ${d.bild ? `<img src="${d.bild}" class="w-10 h-10 rounded-full object-cover shadow-sm flex-shrink-0 border border-slate-100">` : `<div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center flex-shrink-0 text-slate-300 border border-slate-100"><i class="fas fa-utensils"></i></div>`}
                                            
                                            <div class="overflow-hidden">
                                                <h4 class="font-bold text-slate-800 text-sm truncate">${d.namn}</h4>
                                                <p class="text-[10px] text-slate-400 truncate">${(d.ingredienser || []).join(', ')}</p>
                                            </div>
                                        </div>
                                        <div class="flex gap-3 ml-4 no-print flex-shrink-0">
                                            <button onclick="window.app.editDish('${d.id}')" class="text-slate-300 hover:text-emerald-500"><i class="fas fa-pen"></i></button>
                                            <button onclick="window.app.deleteDish('${d.id}')" class="text-slate-300 hover:text-red-400"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
            },

            generateShoppingList() {
                const container = document.getElementById('shopping-list-content');
                const card = document.getElementById('shopping-list-card');
                const totalTag = document.getElementById('total-price-tag');
                
                let all = [];
                Object.values(state.currentMenu).forEach(d => { if(d?.ingredienser) all = [...all, ...d.ingredienser]; });
                if(all.length === 0) { if(card) card.classList.add('hidden'); return; }
                if(card) card.classList.remove('hidden');

                const cats = { 'Frukt & Grönt': [], 'Mejeri': [], 'Kött/Fisk': [], 'Chark': [], 'Skafferi': [], 'Fryst': [], 'Dryck': [] };
                (state.availableCategories || []).forEach(c => cats[c] = []);
                cats['Basvaror'] = []; cats['Övrigt'] = [];

                const keywords = { 
                    'Frukt & Grönt': ['tomat','gurka','lök','sallad','kål','morot','paprika','citron'], 
                    'Mejeri': ['mjölk','ost','ägg','smör','grädde','fraiche','yoghurt'], 
                    'Kött/Fisk': ['lax','färs','kyckling','bacon','skinka','biff','torsk'] 
                };

                let totalEstimatedCost = 0;

                const uniqueIngs = [...new Set(all.map(i => i.toLowerCase().trim()))];
                uniqueIngs.forEach(ing => {
                    let userCat = state.customCategories[ing];
                    if (userCat === 'Grönt' || userCat === 'Frukt och Grönt') userCat = 'Frukt & Grönt';

                    if(state.basvaror.has(ing)) { cats['Basvaror'].push(ing); return; }
                    
                    totalEstimatedCost += this.getPriceEstimate(ing);

                    if(userCat && cats[userCat]) { cats[userCat].push(ing); return; }

                    let foundByKeyword = false;
                    for(const [categoryName, keys] of Object.entries(keywords)) { 
                        if(keys.some(key => ing.includes(key))) { cats[categoryName].push(ing); foundByKeyword = true; break; } 
                    }
                    if(!foundByKeyword) cats['Övrigt'].push(ing);
                });

                if(totalTag) {
                    totalTag.innerText = `Ca totalt: ${totalEstimatedCost} kr`;
                }

                if(container) container.innerHTML = Object.entries(cats).map(([c, items]) => {
                    if(items.length === 0) return '';
                    const isBasvara = c === 'Basvaror';
                    return `
                        <div class="${isBasvara ? 'mt-6 pt-4 border-t border-amber-200 opacity-60' : 'mt-2'}">
                            <h4 class="text-[10px] font-black uppercase tracking-tighter mb-2 text-amber-800/50">${c}</h4>
                            <ul class="space-y-2">
                                ${items.map(i => {
                                    const price = this.getPriceEstimate(i);
                                    const hasCustomPrice = state.customPrices && state.customPrices[i] !== undefined;
                                    return `
                                    <li class="flex justify-between items-center group py-1 border-b border-slate-100 print:border-slate-200">
                                        <div class="flex items-center gap-3">
                                            <input type="checkbox" class="w-5 h-5 rounded border-amber-300 text-emerald-600 no-print">
                                            <span class="hidden print:inline text-slate-400 mr-2">•</span>
                                            <span class="text-sm text-amber-900 capitalize font-medium">${i}</span>
                                            <span class="text-[11px] font-semibold ${hasCustomPrice ? 'text-emerald-700 font-bold' : 'text-amber-700/60'} ml-1 no-print">
                                                ~${price} kr${hasCustomPrice ? '✨' : ''}
                                            </span>
                                        </div>
                                        <button onclick="window.app.openCategoryModal('${i.replace(/'/g, "\\'")}')" class="text-amber-400 hover:text-emerald-600 p-1 no-print">
                                            <i class="fas fa-tag text-[10px]"></i>
                                        </button>
                                    </li>`;
                                }).join('')}
                            </ul>
                        </div>`;
                }).join('');
            },

            notify(msg) {
                const t = document.getElementById('toast');
                if(!t) return;
                t.innerText = msg; t.classList.remove('opacity-0');
                setTimeout(() => t.classList.add('opacity-0'), 2500);
            },

            filterDishes() {
                const t = document.getElementById('search-input').value.toLowerCase();
                document.querySelectorAll('#all-dishes-list > div').forEach(i => i.style.display = i.innerText.toLowerCase().includes(t) ? 'block' : 'none');
            },

            copyList() {
                const items = Array.from(document.querySelectorAll('#shopping-list-content span:not(.print\\:inline)')).map(s => s.innerText);
                navigator.clipboard.writeText("INKÖPSLISTA:\n" + items.join("\n"));
                this.notify("Kopierad!");
            }
        };

        // --- STARTA UP & LYSSNA PÅ FIREBASE ---
        document.getElementById('room-id-val').innerText = state.room;
        document.getElementById('room-label').innerText = `| ${state.room}`;

        onSnapshot(collection(db, PATHS.dishes), snap => {
            state.dishes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            document.getElementById('connection-status').innerHTML = '<i class="fas fa-check-circle text-emerald-300"></i> Online';
            window.app.renderDishList();
            window.app.renderMenu();
        }, () => { document.getElementById('connection-status').innerText = 'Offline/Fel'; });

        onSnapshot(doc(db, PATHS.menu), snap => { if(snap.exists()) { state.currentMenu = snap.data(); window.app.renderMenu(); } });
        onSnapshot(doc(db, "globala_inställningar", "kategorier"), snap => { if(snap.exists()) { state.customCategories = snap.data()?.map || {}; window.app.renderMenu(); } });
        onSnapshot(doc(db, "globala_inställningar", "priser"), snap => { if(snap.exists()) { state.customPrices = snap.data()?.map || {}; window.app.renderMenu(); window.app.renderSettingsPrices(); } });
        onSnapshot(doc(db, "globala_inställningar", "basvaror"), snap => { if(snap.exists() && snap.data().items) { state.basvaror = new Set(snap.data().items.map(i => i.toLowerCase())); window.app.renderMenu(); } });
        onSnapshot(doc(db, "globala_inställningar", "inställningar"), snap => { if(snap.exists()) { state.availableCategories = snap.data().categories || []; window.app.renderSettingsCategories(); window.app.renderMenu(); } });

        window.app.showTab('menu');
    </script>
</body>
</html>
